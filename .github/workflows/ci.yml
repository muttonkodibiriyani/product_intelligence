name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    name: Python — lint, types, tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          # Keep the downloaded wheels: a pruned cache re-downloads them (13 min on #107).
          prune-cache: false
      - name: Install
        run: uv sync --locked
      # Real-browser tests (pytest -m browser) need all three engines; each skips itself when its
      # browser cannot launch, so CI installs them and then refuses any skip. Browser binaries are
      # cached per locked Playwright version; the apt system deps are reinstalled every run.
      - name: Playwright version
        id: playwright
        run: |
          # Fails the job if Playwright is missing from the lock: the browser gate must never be skipped.
          version=$(uv run --no-sync python -c "import importlib.metadata as m; print(m.version('playwright'))")
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Install Playwright browsers + system deps
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: uv run --no-sync playwright install --with-deps chromium firefox webkit
      - name: Install Playwright system deps (browsers cached)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: uv run --no-sync playwright install-deps chromium firefox webkit
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format
        run: uv run ruff format --check .
      - name: mypy (strict)
        run: uv run mypy
      - name: pytest + coverage (no database, no browser)
        run: uv run pytest -m "not db and not browser and not emulator" --cov=pi_core --cov-report=term
      - name: pytest real-browser tests (0 skips allowed)
        run: |
          uv run pytest -m browser -rs --junitxml="$RUNNER_TEMP/browser.xml"
          python3 .github/scripts/assert_no_skips.py "$RUNNER_TEMP/browser.xml"

  firebase-rules:
    name: Firebase rules — Firestore/Storage emulators
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          # Keep the downloaded wheels: a pruned cache re-downloads them (13 min on #107).
          prune-cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install
        run: uv sync --locked
      # demo- project: the emulators never reach real Firebase and need no credentials. The rules
      # module skips itself without the emulators, so CI refuses any skip.
      - name: pytest -m emulator against infra/firebase.json rules (0 skips allowed)
        run: |
          npx -y firebase-tools@14.27.0 emulators:exec --config infra/firebase.json --project demo-pi \
            --only firestore,storage \
            "uv run pytest infra/tests -m emulator -rs --junitxml=$RUNNER_TEMP/emulator.xml"
          python3 .github/scripts/assert_no_skips.py "$RUNNER_TEMP/emulator.xml"

  audit:
    name: Dependency audit (pip-audit, locked deps)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      # Audits exactly what uv.lock pins (hashes required); workspace packages are ours, not PyPI's.
      - name: pip-audit
        run: |
          uv export --locked --no-emit-workspace --format requirements-txt -o "$RUNNER_TEMP/requirements.txt"
          uvx pip-audit==2.10.1 -r "$RUNNER_TEMP/requirements.txt" --require-hashes --disable-pip --strict --progress-spinner off

  database:
    name: Database — migrations up/down, schema tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: pi
          POSTGRES_PASSWORD: pi_ci_only
          POSTGRES_DB: pi
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pi -d pi"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      PI_DATABASE_URL: postgresql+psycopg://pi:pi_ci_only@127.0.0.1:5432/pi
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          # Keep the downloaded wheels: a pruned cache re-downloads them (13 min on #107).
          prune-cache: false
      - name: Install
        run: uv sync --locked
      - name: alembic upgrade head (CLI path)
        run: uv run alembic -c packages/pi_db/alembic.ini upgrade head
      - name: pytest + coverage (full suite, incl. database)
        run: uv run pytest --cov --cov-report=term

  web:
    name: Web — build reproduces the deployed dashboard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Syntax check, secret guard, then a byte-for-byte match with apps/web/deployed.sha256.
      - name: apps/web/build.sh verify
        run: apps/web/build.sh verify

  # The Phase 2 Next.js app in apps/web. Needs no secrets: E2E mocks Firebase and the API.
  web-next:
    name: Web (Next.js) — audit, types, lint, tests, build, E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install (exact lockfile, no install scripts)
        run: npm ci --ignore-scripts
      - name: npm audit (moderate and above)
        run: npm audit --audit-level=moderate
      - name: API types match docs/contracts/pi-api.openapi.json
        run: npm run check:api
      - name: tsc (strict)
        run: npm run typecheck
      - name: ESLint
        run: npm run lint
      - name: Prettier
        run: npm run format
      - name: Vitest
        run: npm test
      - name: Static export + secret scan
        run: npm run build
      - name: Playwright browsers + system deps
        run: npx playwright install --with-deps chromium firefox webkit
      - name: E2E (EN + AR, desktop + mobile, three engines)
        run: npm run e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1 \
            detect --source /repo --config /repo/.gitleaks.toml --redact --no-banner --exit-code 1
      - name: gitleaks custom-rule regression (generated fixtures)
        run: .github/scripts/test_gitleaks_rules.sh zricethezav/gitleaks:v8.30.1
