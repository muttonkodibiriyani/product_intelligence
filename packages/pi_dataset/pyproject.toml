[project]
name = "pi-dataset"
version = "0.1.0"
description = "Published dataset contract pi.dataset/v2: models, JSON Schema and validator (ADR-0007 §6)"
requires-python = ">=3.12"
dependencies = [
  "pi-core",
  "pydantic>=2.11",
]

[project.scripts]
pi-dataset = "pi_dataset.cli:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pi_dataset"]
