[project]
name = "pi-metrics"
version = "0.1.0"
description = "Metric rules over pi.dataset/v2: gaps, index, promotions, assortment, availability (service-layer design §7)"
requires-python = ">=3.12"
dependencies = [
  "pi-core",
  "pi-dataset",
  "pydantic>=2.11",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pi_metrics"]
