[project]
name = "pi-connector-ulta"
version = "0.1.0"
description = "Offline discovery and parsing for the Ulta UAE catalogue"
requires-python = ">=3.12"
dependencies = ["defusedxml>=0.7", "pydantic>=2.9"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pi_connector_ulta"]
