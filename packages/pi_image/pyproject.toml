[project]
name = "pi-image"
version = "0.1.0"
description = "Image-similarity signal for cross-retailer matching: pHash/dHash, embeddings, placeholders"
requires-python = ">=3.12"
dependencies = [
  "pi-core",
  "pi-fetch",
  "pi-match",
  "pydantic>=2.9",
  "numpy>=2.0",
  "pillow>=11.0",
]

[project.optional-dependencies]
# SigLIP image embeddings on CPU ($0): ONNX Runtime only, no torch. Offline runs only.
embed = ["onnxruntime>=1.19"]

[project.scripts]
pi-image = "pi_image.cli:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pi_image"]
