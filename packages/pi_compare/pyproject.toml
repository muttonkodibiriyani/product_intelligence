[project]
name = "pi-compare"
version = "0.1.0"
description = "Evidence-backed cross-retailer product-family and variant comparison"
requires-python = ">=3.12"
dependencies = [
  "pi-core",
  "pi-dataset",
  "pydantic>=2.9",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pi_compare"]
