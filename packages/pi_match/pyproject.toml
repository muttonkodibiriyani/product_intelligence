[project]
name = "pi-match"
version = "0.1.0"
description = "First-pass product matching for Product Intelligence (blueprint §8, demo stage)"
requires-python = ">=3.12"
# Stdlib only on purpose for the first pass: deterministic and dependency-free.
dependencies = [
  "pi-core",
  "pydantic>=2.9",
]

[project.scripts]
pi-match = "pi_match.cli:main"
pi-match-run = "pi_match.run_cli:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pi_match"]
