[project]
name = "pi-fetch"
version = "0.2.0"
description = "Polite fetch layer and connector contract for Product Intelligence (ADR-0006)"
requires-python = ">=3.12"
# Deliberately no curl_cffi, scrapling, camoufox or patchright (ADR-0006); a test enforces it.
dependencies = [
  "pi-core",
  "pydantic>=2.9",
  "httpx>=0.27",
  "playwright>=1.47",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pi_fetch"]
