[project]
name = "pi-api"
version = "0.1.0"
description = "Read-only service-layer API over pi.dataset/v2 snapshots (service-layer design)"
requires-python = ">=3.12"
dependencies = [
  "pi-core",
  "pi-dataset",
  "pi-match",
  "pi-metrics",
  "pydantic>=2.11",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pyjwt[crypto]>=2.9",
  "httpx>=0.27",
]

[project.optional-dependencies]
# Only the image installs it (Dockerfile); dev and tests read datasets from a local directory.
gcs = ["google-cloud-storage>=2.18"]

[project.scripts]
pi-api = "pi_api.contract:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pi_api"]
