[project]
name = "pi-db"
version = "0.1.0"
description = "PostgreSQL schema and Alembic migrations for Product Intelligence"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.13",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pi_db"]
