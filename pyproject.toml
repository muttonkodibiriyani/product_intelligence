[project]
name = "product-intelligence"
version = "0.1.0"
description = "Competitive product and price intelligence platform (workspace root)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = ["pi-capture", "pi-connector-ulta", "pi-core", "pi-dataset", "pi-db", "pi-fetch", "pi-image", "pi-match", "pi-profiles", "pi-metrics", "pi-api"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
pi-capture = { workspace = true }
pi-connector-ulta = { workspace = true }
pi-core = { workspace = true }
pi-dataset = { workspace = true }
pi-metrics = { workspace = true }
pi-api = { workspace = true }
pi-db = { workspace = true }
pi-fetch = { workspace = true }
pi-image = { workspace = true }
pi-match = { workspace = true }
pi-profiles = { workspace = true }

[dependency-groups]
dev = [
  "ruff>=0.6",
  "mypy>=1.11",
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "hypothesis>=6.100",
]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py312"
src = [
  "packages/*/src", "packages/*/tests", "tests", "tools/gulf_probe", "tools/offline_import",
  "tools/page_capture", "tools/browser_capture", "tools/capture_read",
]

[tool.ruff.lint]
select = [
  "E", "W", "F", "I", "B", "UP", "N", "S", "C4", "SIM", "RUF", "PT", "PL", "TID", "DTZ", "ERA",
]
ignore = ["PLR2004"]

[tool.ruff.lint.per-file-ignores]
"packages/*/tests/**" = ["S101", "PLR2004", "PLR0913", "PLR0917", "S608"]
"tests/**" = ["S101", "PLR2004"]
"infra/tests/**" = ["S101", "PLR2004"]
"tools/*/tests/**" = ["S101", "PLR2004"]
"apps/*/pytests/**" = ["S101"]
# Migrations are DDL assembled from frozen module constants, never from input.
"packages/pi_db/src/pi_db/migrations/versions/*" = ["S608"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.format]
quote-style = "double"

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
mypy_path = [
  "packages/pi_capture/src",
  "packages/pi_core/src",
  "packages/pi_connector_ulta/src",
  "packages/pi_dataset/src",
  "packages/pi_metrics/src",
  "packages/pi_db/src",
  "packages/pi_fetch/src",
  "packages/pi_fetch/tests",
  "packages/pi_image/tests",
  "packages/pi_metrics/tests",
  "packages/pi_api/src",
  "packages/pi_api/tests",
  "packages/pi_image/src",
  "packages/pi_match/src",
  "packages/pi_profiles/src",
  "scripts/demo_export",
  "tests",
  "tools/gulf_probe",
  "tools/ulta_snapshot",
  "tools/sephora_snapshot",
  "tools/sephora_snapshot/tests",
  "tools/page_capture",
  "tools/page_capture/tests",
  "tools/browser_capture",
  "tools/browser_capture/tests",
  "tools/capture_read",
  "tools/capture_read/tests",
  "tools/offline_import",
  "infra/scripts",
]
files = [
  "apps/assistant/pytests",
  "packages/pi_capture/scripts",
  "packages/pi_capture/src",
  "packages/pi_capture/tests",
  "packages/pi_core/src",
  "packages/pi_core/tests",
  "packages/pi_connector_ulta/src",
  "packages/pi_connector_ulta/tests",
  "packages/pi_dataset/src",
  "packages/pi_dataset/tests",
  "packages/pi_metrics/src",
  "packages/pi_metrics/tests",
  "packages/pi_api/src",
  "packages/pi_api/tests",
  "packages/pi_db/src",
  "packages/pi_db/tests",
  "packages/pi_fetch/src",
  "packages/pi_fetch/tests",
  "packages/pi_image/src",
  "packages/pi_image/tests",
  "packages/pi_match/src",
  "packages/pi_match/tests",
  "packages/pi_profiles/src",
  "packages/pi_profiles/tests",
  "scripts/demo_export",
  "tests/uat",
  "tools/gulf_probe/gulf_probe/analysis.py",
  "tools/gulf_probe/gulf_probe/plan.py",
  "tools/gulf_probe/tests",
  "tools/ulta_snapshot",
  "tools/sephora_snapshot",
  "tools/page_capture",
  "tools/browser_capture",
  "tools/capture_read",
  "tools/offline_import",
  "infra/scripts/db_url_guard.py",
  "infra/scripts/invite_user.py",
  "infra/scripts/pg_backup.py",
  "infra/scripts/prod_smoke_api.py",
  "infra/scripts/prod_smoke_pages.py",
  "infra/scripts/publish_dataset.py",
  "infra/tests",
]

# infra/scripts import Firebase lazily inside main(); the workspace does not install it.
[[tool.mypy.overrides]]
module = ["firebase_admin", "firebase_admin.*", "google", "google.*"]
ignore_missing_imports = true

# The browser job's Playwright adapter runs only in its container image (tools/browser_capture).
[[tool.mypy.overrides]]
module = ["playwright", "playwright.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["packages", "apps/assistant/pytests", "tests/uat", "tools/gulf_probe/tests", "tools/ulta_snapshot/tests", "tools/sephora_snapshot/tests", "tools/page_capture/tests", "tools/browser_capture/tests", "tools/capture_read/tests", "tools/offline_import/tests", "scripts/demo_export", "infra/tests"]
# Offline CLI adapters reuse scripts.demo_export; importlib-mode pytest needs the same repo root
# that `python -m offline_import.ulta_feed` has, without relying on an operator's PYTHONPATH.
pythonpath = [".", "tests", "packages/pi_fetch/tests", "packages/pi_image/tests", "packages/pi_metrics/tests", "packages/pi_api/tests", "tools/gulf_probe", "tools/ulta_snapshot", "tools/sephora_snapshot", "tools/sephora_snapshot/tests", "tools/page_capture", "tools/page_capture/tests", "tools/browser_capture", "tools/browser_capture/tests", "tools/capture_read", "tools/offline_import", "infra/scripts"]
addopts = "-q --strict-markers --import-mode=importlib"
markers = [
  "browser: launches a real Playwright browser (CI installs engines and asserts 0 skips)",
  "emulator: Firebase rules against the Firestore/Storage emulators (CI job asserts 0 skips)",
  "uat: UAT scenario mapped to a requirement ID (tests/uat)",
  "req(id): requirement ID from docs/requirements/traceability.csv",
  "scenario(id): acceptance scenario UAT-XX from docs/requirements/uat_scenarios.csv",
  "m0: lands in milestone M0 Foundation",
  "m1: lands in milestone M1 Collection",
  "m2: lands in milestone M2 Matching",
  "m3: lands in milestone M3 Metrics + web",
  "m4: lands in milestone M4 AI + hardening",
  "m5: lands in milestone M5 Sign-off",
  "db: needs PostgreSQL + pgvector (PI_DATABASE_URL); skipped when unset",
]

[tool.coverage.run]
branch = true
source = [
  "pi_capture", "pi_core", "pi_connector_ulta", "pi_dataset", "pi_db", "pi_fetch", "gulf_probe",
  "pi_image", "pi_match", "pi_metrics", "offline_import", "pi_api", "pi_profiles", "page_capture",
  "browser_capture", "capture_read",
]
# network entry points that run only inside their job images
omit = ["*/gulf_probe/run.py", "*/browser_capture/pw.py"]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true
