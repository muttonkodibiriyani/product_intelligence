[project]
name = "product-intelligence"
version = "0.1.0"
description = "Competitive product and price intelligence platform (workspace root)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = ["pi-connector-ulta", "pi-core", "pi-db", "pi-fetch", "pi-match"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
pi-connector-ulta = { workspace = true }
pi-core = { workspace = true }
pi-db = { workspace = true }
pi-fetch = { workspace = true }
pi-match = { workspace = true }

[dependency-groups]
dev = [
  "ruff>=0.6",
  "mypy>=1.11",
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "hypothesis>=6.100",
]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["packages/*/src", "packages/*/tests", "tests", "tools/gulf_probe"]

[tool.ruff.lint]
select = [
  "E", "W", "F", "I", "B", "UP", "N", "S", "C4", "SIM", "RUF", "PT", "PL", "TID", "DTZ", "ERA",
]
ignore = ["PLR2004"]

[tool.ruff.lint.per-file-ignores]
"packages/*/tests/**" = ["S101", "PLR2004", "PLR0913", "PLR0917", "S608"]
"tests/**" = ["S101", "PLR2004"]
"tools/*/tests/**" = ["S101", "PLR2004"]
# Migrations are DDL assembled from frozen module constants, never from input.
"packages/pi_db/src/pi_db/migrations/versions/*" = ["S608"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.format]
quote-style = "double"

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
mypy_path = [
  "packages/pi_core/src",
  "packages/pi_connector_ulta/src",
  "packages/pi_db/src",
  "packages/pi_fetch/src",
  "packages/pi_fetch/tests",
  "packages/pi_match/src",
  "scripts/demo_export",
  "tests",
  "tools/gulf_probe",
  "tools/ulta_snapshot",
]
files = [
  "packages/pi_core/src",
  "packages/pi_core/tests",
  "packages/pi_connector_ulta/src",
  "packages/pi_connector_ulta/tests",
  "packages/pi_db/src",
  "packages/pi_db/tests",
  "packages/pi_fetch/src",
  "packages/pi_fetch/tests",
  "packages/pi_match/src",
  "packages/pi_match/tests",
  "scripts/demo_export",
  "tests/uat",
  "tools/gulf_probe/gulf_probe/analysis.py",
  "tools/gulf_probe/gulf_probe/plan.py",
  "tools/gulf_probe/tests",
  "tools/ulta_snapshot",
]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["packages", "tests/uat", "tools/gulf_probe/tests", "tools/ulta_snapshot/tests"]
pythonpath = ["tests", "packages/pi_fetch/tests", "tools/gulf_probe", "tools/ulta_snapshot"]
addopts = "-q --strict-markers --import-mode=importlib"
markers = [
  "browser: launches a real Playwright browser (CI installs engines and asserts 0 skips)",
  "uat: UAT scenario mapped to a requirement ID (tests/uat)",
  "req(id): requirement ID from docs/requirements/traceability.csv",
  "scenario(id): acceptance scenario UAT-XX from docs/requirements/uat_scenarios.csv",
  "m0: lands in milestone M0 Foundation",
  "m1: lands in milestone M1 Collection",
  "m2: lands in milestone M2 Matching",
  "m3: lands in milestone M3 Metrics + web",
  "m4: lands in milestone M4 AI + hardening",
  "m5: lands in milestone M5 Sign-off",
  "db: needs PostgreSQL + pgvector (PI_DATABASE_URL); skipped when unset",
]

[tool.coverage.run]
branch = true
source = ["pi_core", "pi_connector_ulta", "pi_db", "pi_fetch", "gulf_probe", "pi_match"]
omit = ["*/gulf_probe/run.py"]  # network entry point; runs only in the Cloud Run probe job

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true
