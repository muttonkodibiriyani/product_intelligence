[project]
name = "product-intelligence"
version = "0.1.0"
description = "Competitive product and price intelligence platform (workspace root)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = ["pi-core"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
pi-core = { workspace = true }

[dependency-groups]
dev = [
  "ruff>=0.6",
  "mypy>=1.11",
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "hypothesis>=6.100",
]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["packages/*/src", "packages/*/tests"]

[tool.ruff.lint]
select = [
  "E", "W", "F", "I", "B", "UP", "N", "S", "C4", "SIM", "RUF", "PT", "PL", "TID", "DTZ", "ERA",
]
ignore = ["PLR2004"]

[tool.ruff.lint.per-file-ignores]
"packages/*/tests/**" = ["S101", "PLR2004"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.format]
quote-style = "double"

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
mypy_path = ["packages/pi_core/src"]
files = ["packages/pi_core/src", "packages/pi_core/tests"]

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["packages"]
addopts = "-q --strict-markers --import-mode=importlib"

[tool.coverage.run]
branch = true
source = ["pi_core"]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true
