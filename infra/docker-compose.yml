# Local development stack (blueprint §3.3). $0: everything runs on our own server.
#
#   make up        start the stack          make down      stop it (data kept)
#   make db-shell  psql into the database   make emulators Firebase emulators
#
# Host ports come from .env (see .env.example); defaults avoid ports already used on the
# shared build server.
name: product-intelligence

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PI_DB_USER:-pi}
      POSTGRES_PASSWORD: ${PI_DB_PASSWORD:-pi_local_only}
      POSTGRES_DB: ${PI_DB_NAME:-pi}
    ports:
      - "127.0.0.1:${PI_DB_PORT:-55432}:5432"
    volumes:
      - pi_pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  # Placeholder — later PRs in blueprint §16 add these services here:
  #   dagster  (orchestrator, C2)      — PR11 schedules
  #   cube     (semantic layer, C11)   — PR16 dbt + Cube
  # Do not add them before their PR; keep this file the single local-stack entry point.

volumes:
  pi_pgdata:
