The longevity is excellent—it lasts for hours on my skin. The quality feels niche-level, with a refined and luxurious composition. I would definitely buy a bottle if it weren’t so expensive.","reviewRating":5},{"@type":"Review","author":"apg12","datePublished":"2026-07-31T06:54:22.000+00:00","reviewBody":"Took a shower waited a couple minutes to dry up and took a few sprays and I will say this. \nIt’s smells great when adding it on but, the longevity and strength of the smell isn’t what I expected and was a bit dissapointed. For a pardon I expected the smell to be a bit stronger. My BLEU DE CHANEL toilette is stronger than this one and it lasts longer too for some reason. I’ll be returning this one and hopefully the elixir is stronger and lasts longer too.","reviewRating":3},{"@type":"Review","author":"Smelly1","datePublished":"2026-07-28T04:43:00.000+00:00","reviewBody":"[This review was collected as part of a promotion.] Got a sample from Bzzagent just in time for vacation. So I had plenty of chances to wear it. Even trying to go light this scent overwhelmed my party. No one, not even the 13 yo that drenches himself in cologne couldn’t wear it. Smells nice, just very strong. And maybe not the scent for me.","reviewRating":3},{"@type":"Review","author":"bry7ant","datePublished":"2026-07-28T00:26:34.000+00:00","reviewBody":"[This review was collected as part of a promotion.] I got this for free from bzzagent i love the smell of it i would buy it in a instant the price is good only 125 pretty cheap for this type if brand i would recommend it 10/10 love it","reviewRating":5},{"@type":"Review","author":"userkkpatel","datePublished":"2026-07-26T16:23:16.000+00:00","reviewBody":"[This review was collected as part of a promotion.] amazing cologne! one of my top 3 out there and it last for so long!! i got the product for free in exchange for writing the review! By BzzAgent","reviewRating":5},{"@type":"Review","author":"Amujaswal","datePublished":"2026-07-23T06:05:25.000+00:00","reviewBody":"[This review was collected as part of a promotion.] Got opportunity to try this fragrance it has eoody notes . But I got very tiny sample so only tried 2 or 3 times and I think it lasts long","reviewRating":4},{"@type":"Review","author":"RonnieJr","datePublished":"2026-07-22T17:52:25.000+00:00","reviewBody":"[This review was collected as part of a promotion.] Bleu de Chanel L’Exclusif Parfum is a luxurious, timeless fragrance with excellent longevity, refined character, and outstanding versatility. It’s an excellent choice for anyone looking for a polished signature scent that consistently receives compliments.","reviewRating":5},{"@type":"Review","author":"AJHeff","datePublished":"2026-07-22T16:09:34.000+00:00","reviewBody":"[This review was collected as part of a promotion.] I think the DNA of this fragrance has potential, but it has a distinct chemical smell characteristic of many high-end perfumes. It opens with a fresh citrus that develops into a pronounced ginger at the heart. As it settles down, the amber and jasmine notes become more prominent. I like that it’s lightweight and airy—ideal for summer and spring. However, I’m not a fan of the powdery elements which make it feel too mature for my age demographic (I’m 32). Despite the contemporary notes in the top and the middle, I don’t smell these elements in the formula; it smells like a vintage/traditional blend than anything innovative. This makes sense for the classic Chanel aesthetic, but then why include them at all? Furthermore, this fragrance is too heavy and masculine to be considered unisex in my opinion. For these reasons, I think fragrance is best suited for a male over 50. \n\nI will say, despite the synthetic elements, it does have great longevity and projection. With just one spray, my partner noticed it immediately from a distance. I also tried to wash it off because it wasn’t for me, but it stuck so well to the skin that it lingered. \n\nOverall, if this formula was translated into a more natural blend with higher quality ingredients and more balanced ratios, I think it would be more pleasant to wear and would offer more complexity. As is, it’s average at best and, for me, it’s a hard pass at this price point. I have lower cost fragrances that convey each note more clearly and offer a more elevated experience as a result. Invest elsewhere.","reviewRating":2}]}</script>
